<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keerthana ND - Personal Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;
            width: 90%;
            max-width: 600px;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #e91e63;
            margin-bottom: 10px;
            font-size: 36px;
        }

        .college {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .info {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: #fff0f5;
            padding: 18px;
            border-radius: 12px;
            font-size: 18px;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
            background-color: #ffe0eb;
        }

        .emoji {
            font-size: 28px;
            margin-right: 10px;
        }

        footer {
            margin-top: 30px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Hi, I'm Keerthana ND 👋</h1>

        <p class="college">
            🎓 Currently studying at<br>
            <strong>Jain Institute of Technology, Davanagere</strong>
        </p>

        <div class="info">

            <div class="card">
                <span class="emoji">🍳</span>
                My Favourite Food: <strong>Egg Rice</strong>
            </div>

            <div class="card">
                <span class="emoji">💃</span>
                My Hobby: <strong>Dancing</strong>
            </div>

        </div>

        <footer>
            Made with ❤️ by Keerthana ND
        </footer>
    </div>

</body>
</html>
